<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>宏观日报归档</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f8;
    --fg: #1c1c1e;
    --muted: #6b6b70;
    --card: #fff;
    --line: #e4e4e9;
    --accent: #0a84ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11;
      --fg: #f2f2f7;
      --muted: #98989f;
      --card: #1a1a1d;
      --line: #2b2b30;
      --accent: #4da3ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px 72px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 680px; margin: 0 auto; }
  .eyebrow {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.02em; }
  .meta { margin: 0 0 28px; color: var(--muted); font-size: 13.5px; }
  ul { margin: 0; padding: 0; list-style: none; }
  li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 10px;
    transition: border-color .15s;
  }
  li:hover { border-color: var(--accent); }
  li a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 20px;
    color: inherit;
    text-decoration: none;
  }
  .date { font-weight: 600; font-size: 15.5px; }
  .weekday { color: var(--muted); font-size: 13px; }
  .arrow { color: var(--accent); font-size: 18px; line-height: 1; }
  .empty {
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 24px;
    color: var(--muted);
    font-size: 14.5px;
  }
  footer { margin-top: 28px; color: var(--muted); font-size: 12.5px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Macro Daily</p>
  <h1>宏观日报归档</h1>
  <p class="meta">由宏观分析师「观潮」生成 · 每日更新</p>

  <ul id="list">
    <!-- 新的日报插到这一行下面，格式：
    <li><a href="report-2026-01-01.html"><span class="date">2026-01-01</span><span class="weekday">周四</span><span class="arrow">→</span></a></li>
    -->
  </ul>

  <div class="empty" id="empty">还没有日报。第一份生成后会出现在这里。</div>

  <footer>
    <p>区分事实与判断，不构成投资建议。<a href="../">返回站点首页</a></p>
  </footer>
</main>
<script>
  var list = document.getElementById('list');
  if (list.querySelector('li')) document.getElementById('empty').remove();
</script>
</body>
</html>
