<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>人生地图 · 只读化与自我认知结构 · UI 稿 v1（示例数据）</title>
<style>
  /* 颜色 / 圆角 / 阴影取自 apps/mobile/src/styles/tokens.css；人生地图自身的骨架
     （.life-map-intro / -tabs / -now-card / -timeline / -themes）取自 life-map.css。
     领域色沿用现有口径：工作 = accent、关系 #be607b、生活 #4f8b74、创造 #7d67c8。 */
  :root {
    --bg: #f5f6f8; --bg-soft: #f2f3f5; --surface: #ffffff;
    --border: #eaecf0; --border-strong: #d9dce1;
    --text: #1f2329; --text-soft: #373c43; --muted: #646a73; --muted-2: #8f959e;
    --accent: #3370ff; --accent-strong: #245bdb; --accent-soft: #eef3ff; --accent-border: #c9d8ff;
    --danger: #b04458; --danger-soft: #fae9ed;
    --success: #2f7a4a; --success-soft: #e8f4ec;
    --warning: #95611d; --warning-soft: #fbf1df; --warning-border: #e6d2ae;
    --work: #3370ff; --relationship: #be607b; --life: #4f8b74; --creation: #7d67c8;
    --shadow-sm: 0 2px 8px rgba(31, 35, 41, 0.05);
    --shadow-lg: 0 24px 64px rgba(31, 35, 41, 0.2);
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 72px; background: var(--bg); color: var(--text);
    font: 15px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  .page-sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .page-sub a { color: var(--accent-strong); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    font-size: 12px; line-height: 1.5; color: var(--muted);
  }
  .badge.new { border-color: var(--accent-border); background: var(--accent-soft); color: var(--accent-strong); }
  .badge.gone { border-color: #e7c4cd; background: var(--danger-soft); color: var(--danger); }

  /* 屏切换 */
  .switcher { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .switcher button {
    padding: 7px 12px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted); font: inherit; font-size: 12.5px;
    font-weight: 600; cursor: pointer; transition: all .15s var(--ease);
  }
  .switcher button:hover { border-color: var(--border-strong); color: var(--text); }
  .switcher button[aria-selected="true"] { border-color: var(--accent-border); background: var(--accent-soft); color: var(--accent-strong); }

  .stage { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }

  /* 手机壳 */
  .phone {
    flex: 0 0 auto; width: 390px; height: 780px;
    border: 1px solid var(--border-strong); border-radius: 42px;
    background: var(--surface); box-shadow: var(--shadow-sm);
    overflow: hidden; position: relative;
  }
  .phone.is-narrow { width: 360px; height: 720px; }
  .phone-inner { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .statusbar { flex: 0 0 auto; display: flex; justify-content: space-between; padding: 12px 22px 4px; font-size: 12px; font-weight: 600; }
  .statusbar span:last-child { color: var(--muted); font-weight: 500; }
  .hdr {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 8px 14px 10px; border-bottom: 1px solid var(--border);
  }
  .hdr h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .hdr .back { width: 30px; height: 30px; display: grid; place-items: center; color: var(--text); }
  .hdr .spacer { flex: 1; }
  .hdr .icon { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); }
  .scroll { flex: 1; overflow-y: auto; padding: 12px 14px calc(20px + env(safe-area-inset-bottom)); }
  .scroll::-webkit-scrollbar { width: 0; }

  /* ── 人生地图骨架（照 life-map.css） ── */
  .lm-screen { display: grid; gap: 12px; }
  .lm-intro {
    display: grid; grid-template-columns: 46px minmax(0,1fr) 38px; align-items: center; gap: 12px;
    border: 1px solid color-mix(in srgb, var(--accent) 20%, var(--border));
    border-radius: 16px; padding: 14px;
    background: linear-gradient(140deg, var(--surface), color-mix(in srgb, var(--accent-soft) 72%, var(--surface)));
  }
  .lm-intro-icon { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 20px; }
  .lm-intro > div:nth-child(2) { display: grid; gap: 3px; min-width: 0; }
  .lm-intro strong { font-size: 16px; }
  .lm-intro span { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  .lm-intro > button { display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 12px; background: color-mix(in srgb, var(--accent) 9%, var(--surface)); color: var(--accent); cursor: pointer; }
  .lm-trust { margin: -4px 3px 0; color: var(--muted-2); font-size: 11.5px; line-height: 1.5; }
  .lm-tabs { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 4px; padding: 4px; border-radius: 13px; background: var(--bg-soft); }
  .lm-tabs button { min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 750; cursor: pointer; }
  .lm-tabs button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .lm-filters { display: flex; gap: 8px; overflow-x: auto; padding: 0 1px 2px; scrollbar-width: none; }
  .lm-filters::-webkit-scrollbar { display: none; }
  .lm-filters button {
    flex: 0 0 auto; min-height: 34px; padding: 0 13px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .lm-filters button.active { border-color: var(--accent-border); background: var(--accent-soft); color: var(--accent-strong); }
  .lm-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 4px 3px 0; }
  .lm-heading strong { font-size: 14px; }
  .lm-heading span { color: var(--muted-2); font-size: 11.5px; }

  /* ── 新：覆盖度条 ── */
  .cov { display: grid; gap: 7px; padding: 13px 14px; border: 1px solid var(--border); border-radius: 15px; background: var(--surface); }
  .cov-title { display: flex; align-items: baseline; justify-content: space-between; }
  .cov-title strong { font-size: 13.5px; }
  .cov-title span { color: var(--muted-2); font-size: 11.5px; }
  .cov-row { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; align-items: center; gap: 9px; }
  .cov-name { font-size: 12.5px; font-weight: 700; color: var(--text-soft); }
  .cov-bar { display: flex; gap: 3px; align-items: center; }
  .cov-pip { width: 13px; height: 7px; border-radius: 3px; background: var(--border); }
  .cov-pip.on { background: currentColor; }
  .cov-row.work { color: var(--work); } .cov-row.relationship { color: var(--relationship); }
  .cov-row.life { color: var(--life); } .cov-row.creation { color: var(--creation); }
  .cov-gap { font-size: 11px; color: var(--muted-2); white-space: nowrap; }
  .cov-gap.warn { color: var(--warning); }
  .cov-gap.empty { color: var(--danger); font-weight: 700; }
  .cov-foot { color: var(--muted-2); font-size: 11px; line-height: 1.5; }

  /* ── 新：变化层 ── */
  .chg { display: grid; gap: 10px; }
  .chg-card { border: 1px solid var(--border); border-radius: 15px; background: var(--surface); overflow: hidden; }
  .chg-top { display: flex; align-items: center; gap: 8px; padding: 12px 14px 9px; }
  .chg-dot { width: 8px; height: 8px; border-radius: 50%; }
  .chg-card.work .chg-dot { background: var(--work); } .chg-card.relationship .chg-dot { background: var(--relationship); }
  .chg-card.life .chg-dot { background: var(--life); } .chg-card.creation .chg-dot { background: var(--creation); }
  .chg-top strong { font-size: 14px; }
  .chg-top .tag { margin-left: auto; padding: 2px 7px; border-radius: 6px; background: var(--bg-soft); color: var(--muted); font-size: 10.5px; font-weight: 700; }
  .chg-body { display: grid; gap: 0; padding: 0 14px 12px; }
  .chg-step { display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 10px; padding: 8px 0; border-top: 1px dashed var(--border); }
  .chg-step:first-child { border-top: 0; }
  .chg-when { color: var(--muted-2); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .chg-what { font-size: 13px; line-height: 1.55; color: var(--text-soft); }
  .chg-what b { color: var(--text); font-weight: 700; }
  .chg-mid { margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: var(--bg-soft); font-size: 12px; color: var(--muted); line-height: 1.5; }
  .chg-mid em { font-style: normal; color: var(--text-soft); font-weight: 700; }
  .chg-evidence { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
  .chg-chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border: 1px solid var(--border);
    border-radius: 999px; background: var(--surface); color: var(--muted); font: inherit; font-size: 11px; cursor: pointer;
  }
  .chg-chip:hover { border-color: var(--accent-border); color: var(--accent-strong); }

  /* ── 现在卡（照 .life-map-now-card） ── */
  .now-grid { display: grid; gap: 10px; }
  .now-card {
    position: relative; display: grid; grid-template-columns: 28px minmax(0,1fr) 18px; gap: 5px 9px;
    border: 1px solid var(--border); border-radius: 15px; padding: 15px; background: var(--surface);
    color: var(--muted); text-align: left; font: inherit; cursor: pointer; width: 100%;
  }
  .now-card > .ico { grid-row: 1 / span 2; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: var(--surface-muted); }
  .now-card.work > .ico { color: var(--work); } .now-card.relationship > .ico { color: var(--relationship); }
  .now-card.life > .ico { color: var(--life); } .now-card.creation > .ico { color: var(--creation); }
  .now-card > span { color: var(--muted-2); font-size: 11px; font-weight: 750; }
  .now-card > strong { font-size: 15px; color: var(--text); }
  .now-card > p { grid-column: 2 / 4; margin: 3px 0 0; color: var(--text-soft); font-size: 13px; line-height: 1.55; }
  .now-card > .chev { grid-column: 3; grid-row: 1 / span 2; align-self: center; color: var(--muted-2); }
  .now-card.is-empty { border-style: dashed; }
  .now-card.is-empty > strong { color: var(--muted); }

  /* ── 轨迹（照 .life-map-timeline） ── */
  .tl { position: relative; display: grid; gap: 0; }
  .tl::before { content: ""; position: absolute; left: 9px; top: 16px; bottom: 16px; width: 1px; background: var(--border); }
  .tl-item { position: relative; display: grid; grid-template-columns: 19px minmax(0,1fr); gap: 10px; padding: 7px 0; }
  .tl-dot { width: 9px; height: 9px; margin: 6px 0 0 5px; border-radius: 50%; z-index: 1; }
  .tl-item.work .tl-dot { background: var(--work); } .tl-item.relationship .tl-dot { background: var(--relationship); }
  .tl-item.life .tl-dot { background: var(--life); } .tl-item.creation .tl-dot { background: var(--creation); }
  .tl-body { min-width: 0; }
  .tl-when { color: var(--muted-2); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tl-title { font-size: 13.5px; font-weight: 700; margin: 1px 0 2px; }
  .tl-sum { color: var(--text-soft); font-size: 12.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tl-gap { display: flex; align-items: center; gap: 8px; margin: 4px 0 4px 29px; color: var(--muted-2); font-size: 11px; }
  .tl-gap::before, .tl-gap::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* ── 主题（照 .life-map-theme-list） ── */
  .th-list { display: grid; gap: 10px; }
  .th-card { border: 1px solid var(--border); border-radius: 15px; background: var(--surface); padding: 13px 14px; }
  .th-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .th-top .dot { width: 8px; height: 8px; border-radius: 50%; }
  .th-card.work .dot { background: var(--work); } .th-card.relationship .dot { background: var(--relationship); }
  .th-card.life .dot { background: var(--life); } .th-card.creation .dot { background: var(--creation); }
  .th-top strong { font-size: 14px; }
  .th-top .n { margin-left: auto; color: var(--muted-2); font-size: 11px; }
  .th-sum { margin: 0; color: var(--text-soft); font-size: 13px; line-height: 1.55; }
  .th-ev { margin-top: 9px; border-top: 1px solid var(--border); padding-top: 8px; display: grid; gap: 6px; }
  .th-ev-row { display: grid; grid-template-columns: 16px minmax(0,1fr); gap: 7px; align-items: start; }
  .th-ev-row .bullet { color: var(--muted-2); font-size: 11px; line-height: 1.6; }
  .th-ev-row .txt { color: var(--text-soft); font-size: 12.5px; line-height: 1.5; }
  .th-ev-more { color: var(--accent-strong); font-size: 11.5px; font-weight: 700; background: none; border: 0; padding: 2px 0; text-align: left; cursor: pointer; font-family: inherit; }

  /* ── 详情 / 原文 ── */
  /* z-index 必须有：.tl-item / .th-card 是 position:relative，会在同一层叠上下文里
     盖过没写 z-index 的 absolute 浮层 —— 症状是时间轴的小圆点穿透到浮层文字上。 */
  .detail-backdrop { position: absolute; inset: 0; z-index: 20; background: rgba(31,35,41,.28); display: flex; align-items: flex-end; }
  .detail { width: 100%; max-height: 82%; display: flex; flex-direction: column; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: var(--shadow-lg); }
  .detail-handle { width: 38px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 8px auto 2px; }
  .detail-hdr { display: flex; align-items: center; gap: 8px; padding: 8px 16px 10px; }
  .detail-hdr .badge-d { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--bg-soft); color: var(--muted); font-size: 11.5px; font-weight: 700; }
  .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-2); }
  .badge-dot.relationship { background: var(--relationship); }
  .src-mark { width: 3px; height: 12px; border-radius: 2px; background: var(--border-strong); }
  .detail-hdr .x { margin-left: auto; width: 30px; height: 30px; display: grid; place-items: center; color: var(--muted); }
  .detail-body { overflow-y: auto; padding: 0 16px 20px; }
  .detail-body h3 { margin: 4px 0 6px; font-size: 18px; line-height: 1.35; }
  .detail-time { color: var(--muted-2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .detail-p { margin: 10px 0 0; color: var(--text-soft); font-size: 14px; line-height: 1.65; }
  .src-box { margin-top: 14px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .src-head { display: flex; align-items: center; gap: 7px; padding: 9px 11px; background: var(--bg-soft); font-size: 11.5px; color: var(--muted); }
  .src-head strong { color: var(--text-soft); font-size: 12px; }
  .src-head .open { margin-left: auto; color: var(--accent-strong); font-weight: 700; }
  .src-raw { padding: 11px; font-size: 12.5px; line-height: 1.7; color: var(--text-soft); white-space: pre-wrap; background: var(--surface); }
  .src-raw .hl { background: #fff8e1; box-shadow: 0 0 0 2px #fff8e1; }
  .src-note { padding: 0 11px 10px; color: var(--muted-2); font-size: 11px; }

  /* 状态条 */
  .lm-fresh { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid var(--warning-border); border-radius: 14px; background: var(--warning-soft); color: #7a5416; font-size: 12.5px; }
  .lm-fresh strong { font-size: 13px; }
  .lm-fresh button { margin-left: auto; border: 1px solid #efd6a4; border-radius: 9px; background: #fffdf8; color: #865b17; font: inherit; font-size: 12px; font-weight: 700; padding: 5px 10px; cursor: pointer; }
  .lm-empty { display: grid; place-items: center; gap: 6px; padding: 26px 18px; border: 1px dashed var(--border-strong); border-radius: 15px; color: var(--muted); text-align: center; }
  .lm-empty strong { font-size: 14px; color: var(--text-soft); }
  /* 空态标记：一个空心圈 + 领域色，比放一个字形干净（不放 emoji、也不放方块）。 */
  .empty-mark { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--border-strong); }
  .empty-mark.creation { border-color: color-mix(in srgb, var(--creation) 55%, var(--border-strong)); }
  .lm-empty span { font-size: 12px; }

  /* 改前：写入入口 */
  .old-collection { display: grid; gap: 8px; }
  .old-capture { display: flex; align-items: center; gap: 11px; padding: 13px; border: 1px solid var(--border); border-radius: 15px; background: var(--surface); }
  .old-capture .ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); }
  .old-capture div { display: grid; gap: 2px; min-width: 0; }
  .old-capture strong { font-size: 13.5px; }
  .old-capture small { color: var(--muted-2); font-size: 11.5px; }
  .old-inbox { display: flex; align-items: center; gap: 8px; padding: 11px 13px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); color: var(--text-soft); font-size: 13px; font-weight: 700; }
  .old-inbox b { margin-left: auto; padding: 1px 7px; border-radius: 999px; background: var(--danger-soft); color: var(--danger); font-size: 11px; }
  .old-chat { display: flex; align-items: center; gap: 8px; padding: 11px 13px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); color: var(--text-soft); font-size: 13px; font-weight: 700; }
  .mark-gone { position: relative; }
  .mark-gone::after {
    content: "摘掉"; position: absolute; right: 8px; top: -7px; padding: 1px 7px;
    border-radius: 999px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
    box-shadow: 0 0 0 2px var(--surface);
  }

  /* 说明面板 */
  .notes { flex: 1 1 380px; min-width: 320px; max-width: 460px; display: grid; gap: 12px; align-content: start; }
  .note { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 14px 16px; }
  .note h3 { margin: 0 0 8px; font-size: 14px; }
  .note p { margin: 0 0 8px; color: var(--text-soft); font-size: 13px; line-height: 1.6; }
  .note p:last-child { margin-bottom: 0; }
  .note ul { margin: 0; padding-left: 18px; color: var(--text-soft); font-size: 13px; line-height: 1.65; }
  .note code { padding: 1px 5px; border-radius: 5px; background: var(--bg-soft); font-size: 11.5px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .note.warn { border-color: var(--warning-border); background: var(--warning-soft); }
  .note.warn h3 { color: #7a5416; }
  .note.new { border-color: var(--accent-border); background: linear-gradient(160deg, var(--surface), var(--accent-soft)); }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.tbl th, table.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  table.tbl th { color: var(--muted); font-weight: 700; font-size: 11.5px; }
  table.tbl td { color: var(--text-soft); }

  @media (max-width: 900px) {
    .stage { flex-direction: column; }
    .phone, .phone.is-narrow { width: 100%; max-width: 390px; height: 720px; margin: 0 auto; }
    .notes { max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>人生地图 · 只读化与自我认知结构</h1>
  <p class="page-sub">
    UI 稿 v1 · 2026-10-18 · 产品经理 ·
    示例数据：<b>全部虚构</b>。这是编出来的一个人（周叙），只借用真实数据的<strong>形态</strong>（4 份来源 / 4 张现在卡 / 21 个节点 / 5 个主题 / 工作跨度大中间空档 / 关系密集 / 生活与创造为空），人名、公司、地点、时间、事件没有一样是真的。
  </p>
  <div class="legend">
    <span class="badge gone">摘掉</span>
    <span class="badge new">新加</span>
    <span class="badge">保留不变</span>
  </div>

  <div class="switcher" role="tablist" aria-label="屏">
    <button type="button" data-screen="before" aria-selected="true">① 改前 · 现状</button>
    <button type="button" data-screen="overview">② 改后 · 总览（覆盖度 + 现在）</button>

function domainIcon(domain, size = 16) {

  };
  return open + paths[domain] + '</svg>';
}

/* ══ 渲染 ══ */
const state = { screen: "before" };
const phone = document.getElementById("phone");
const inner = document.getElementById("phone-inner");
const notes = document.getElementById("notes");

function render() {
  const s = state.screen;
  inner.innerHTML = SCREENS[s]();
  notes.innerHTML = NOTES[s] || "";
  phone.classList.toggle("is-narrow", s === "narrow");
  document.querySelectorAll(".switcher button").forEach((b) => {
    b.setAttribute("aria-selected", String(b.dataset.screen === s));
  });
}

document.querySelectorAll(".switcher button").forEach((b) => {
  b.addEventListener("click", () => { state.screen = b.dataset.screen; render(); });
});

render();
</script>
